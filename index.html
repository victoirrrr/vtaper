<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lift Run Breathe</title>
<!-- Polished with unslop by Damir Sokolovsky (@heydamir), CC BY 4.0 -->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one phone-width column under a sticky game HUD. Bumper-plate colours encode sessions and plates loaded on your own barbell encode your level. */
@property --p{syntax:"<number>";inherits:false;initial-value:0}
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#E3E7EC; --ink:#12161C; --ink-2:#47505D; --ink-3:#646D7A; --line:#D3D9E0; --gold-ink:#866000;
  --red:#D2283C; --blue:#1E50D6; --yellow:#E2AA12; --green:#1C9656; --violet:#7B4BD6; --rest:#AEB6C1; --plate-w:#F7F8FA;
  --walk:#C3CAD3; --jog:#7CCB9F; --gold:#E2AA12;
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --ease:var(--ease); --fast:.15s; --med:.3s;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F14; --surface:#151A21; --surface-2:#1D232C; --ink:#E8ECF1; --ink-2:#A9B1BE; --ink-3:#8A93A2; --line:#29303A; --gold-ink:#F0BE2E;
  --red:#EF4A5D; --blue:#5280FF; --yellow:#F0BE2E; --green:#33BF77; --violet:#A07BFF; --rest:#5E6876; --plate-w:#D9DEE5; --walk:#3A424E; --jog:#2E7A52; --gold:#F0BE2E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F14; --surface:#151A21; --surface-2:#1D232C; --ink:#E8ECF1; --ink-2:#A9B1BE; --ink-3:#8A93A2; --line:#29303A; --gold-ink:#F0BE2E;
  --red:#EF4A5D; --blue:#5280FF; --yellow:#F0BE2E; --green:#33BF77; --violet:#A07BFF; --rest:#5E6876; --plate-w:#D9DEE5; --walk:#3A424E; --jog:#2E7A52; --gold:#F0BE2E; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 180px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{font-family:var(--display);font-weight:600;font-size:19px;line-height:1;white-space:nowrap}
.brand span{color:var(--ink-3)}
.topr{display:flex;align-items:center;gap:8px;flex:none}
.brand{min-width:0;overflow:hidden;text-overflow:ellipsis}
@media (max-width:430px){.brand{font-size:16px;letter-spacing:.03em}.iconbtn{width:36px;height:36px}.stepper button{width:28px;height:28px}}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.stepper button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.stepper button:hover{background:var(--surface-2)}
.stepper button:disabled{opacity:.3;cursor:default;background:none}
.stepper .lbl{font-family:var(--display);font-weight:600;font-size:14px;padding:0 4px;white-space:nowrap}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:0 -8px 12px;padding:8px 8px;border-bottom:1px solid transparent;transition:border-color .2s}
.hud.stuck{border-bottom-color:var(--line)}
.hudrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center}
.lvl{--p:0;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--surface-2) 0);transition:--p .9s var(--ease);position:relative}
.lvl::before{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ink)}
.lvl b{position:relative;font-family:var(--display);font-weight:600;font-size:20px;color:var(--bg);line-height:1}
.lvl small{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-family:var(--display);font-weight:600;font-size:9px;letter-spacing:.08em;background:var(--gold);color:#12161C;padding:1px 4px;border-radius:4px}
.lvl.bump{animation:bump .6s var(--ease)}
@keyframes bump{40%{transform:scale(1.25)}}
.lvt{min-width:0}
.lvt b{display:block;font-family:var(--display);font-weight:600;font-size:17px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lvt span{font-size:13px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.streak{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:600;font-size:20px;padding:4px 12px 4px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}

.streak.cold svg{animation:none;filter:grayscale(1);opacity:.5}
.bmini{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.bmini .hpm{width:36px;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bmini .hpm i{display:block;height:100%;background:var(--red);transition:width .5s}

.plates{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:20px}
.plate{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0 4px;border-radius:12px;transition:background-color var(--fast)}
.plate:hover{background:var(--surface-2)}
.disc{--pc:var(--rest);width:100%;max-width:42px;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--bg) 0 13%,color-mix(in srgb,var(--pc) 55%,var(--ink)) 14% 19%,var(--pc) 20% 60%,color-mix(in srgb,var(--pc) 78%,var(--ink)) 61% 65%,var(--pc) 66% 100%);
  transition:transform var(--med) var(--ease);position:relative}
.plate.sel .disc{transform:translateY(-4px)}
.plate.full .disc::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid var(--gold)}
.plate .d{font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink-3);line-height:1}
.plate.sel .d{color:var(--ink)}
.plate .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);line-height:1;display:flex;align-items:center;gap:4px;height:12px}
.plate .n i{width:5px;height:5px;border-radius:50%;background:var(--ink);display:inline-block}

/* boss card */
.boss{display:grid;grid-template-columns:76px 1fr;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:20px;position:relative;overflow:hidden}
.boss.dead{border-color:var(--gold)}
.bav{width:76px;height:76px}
.bav svg{display:block;width:100%;height:100%;overflow:visible}
@keyframes bob{50%{transform:translateY(-4px) scaleY(1.03)}}
.hit{animation:shake .45s cubic-bezier(.36,.07,.19,.97)!important}
.hit svg{filter:brightness(1.8) saturate(.4)}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px) rotate(-4deg)}40%,60%{transform:translateX(6px) rotate(4deg)}}
.bmeta{min-width:0}
.bmeta .eyebrow{font-size:12px}
.bmeta h3{margin:1px 0 8px;font-family:var(--display);font-weight:600;font-size:22px;line-height:1}
.hp{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;position:relative}
.hp i{position:absolute;inset:0 auto 0 0;background:var(--red);border-radius:6px;transition:width .6s var(--ease)}
.hp em{position:absolute;inset:0 auto 0 0;background:var(--ink);opacity:.18;border-radius:6px;transition:width 1.2s .35s ease}
.hpt{display:flex;flex-wrap:wrap;gap:0 8px;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:4px}
.taunt{font-size:14px;color:var(--ink-2);margin-top:4px}

.eyebrow{font-family:var(--display);font-weight:500;font-size:15px;color:var(--ink-3)}
.eyebrow b{color:var(--ink);font-weight:600}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-bottom:16px;position:relative}
h1{font-family:var(--display);font-weight:600;font-size:clamp(44px,13vw,62px);line-height:.9;letter-spacing:-.01em;margin:4px 0 8px;text-transform:uppercase;text-wrap:balance}
h1 .tag{display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--c);vertical-align:.12em;margin-right:.18em}
.focus{font-size:17px;color:var(--ink-2);margin:0}
.heromt{font-size:13px;color:var(--ink-3);margin-top:8px}
.ringwrap{position:relative;width:84px;height:84px}
.ringwrap svg{display:block;transform:rotate(-90deg)}
.ringwrap .pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:22px}
.ringwrap .pct small{display:block;font-family:var(--body);font-weight:500;font-size:10px;color:var(--ink-3);text-align:center;margin-top:-4px}
.ring-fg{transition:stroke-dashoffset .6s var(--ease)}
.stamp{position:absolute;right:-4px;top:-10px;transform:rotate(-12deg);font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);border:3px solid var(--gold-ink);border-radius:8px;padding:2px 12px;background:color-mix(in srgb,var(--bg) 70%,transparent);pointer-events:none}
.stamp.fresh{animation:stamp .55s var(--ease)}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.6);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--ink-2);margin:0 0 20px}

/* quests */
.quests{display:grid;gap:8px}
.quest{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;transition:border-color .25s,background .25s}
.quest.done{border-color:var(--green);background:color-mix(in srgb,var(--green) 8%,var(--surface))}
.quest .qt{min-width:0}
.quest .qt b{display:block;font-weight:500;font-size:16px}
.quest .qt span{font-size:13px;color:var(--ink-3)}
.quest.done .qt b{text-decoration:line-through;color:var(--ink-3)}
.xpt{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--gold-ink);white-space:nowrap}
.dice{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center}
.dice.roll svg{animation:roll .7s var(--ease)}
@keyframes roll{to{transform:rotate(720deg) scale(1)}40%{transform:rotate(300deg) scale(1.3)}}
.dice:disabled{opacity:.35;cursor:default}
.qside{display:flex;align-items:center;gap:8px}

/* sections */
.sec{margin-bottom:28px}
.sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sech h2{font-family:var(--display);font-weight:600;font-size:24px;margin:0;line-height:1}
.sech span{font-family:var(--mono);font-size:12px;color:var(--ink-3)}

.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:12px 2px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.cb{width:24px;height:24px;border-radius:8px;border:1.5px solid var(--ink-3);display:grid;place-items:center;margin-top:1px;transition:background-color var(--fast),border-color var(--fast),color var(--fast)}
.cb svg{opacity:0;transform:scale(.4);transition:opacity var(--fast) var(--ease),transform var(--fast) var(--ease);color:var(--on-c)}
.done>.cb,.step.done .cb,.quest.done .cb{background:var(--c,var(--green));border-color:var(--c,var(--green))}
.quest.done .cb{background:var(--green);border-color:var(--green)}
.quest.done .cb svg{color:#fff}
.step.done .cb svg,.quest.done .cb svg{opacity:1;transform:scale(1)}
.step .txt{min-width:0}
.step .nm{font-weight:500;font-size:16px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.step .ds{font-family:var(--mono);font-size:13px;color:var(--ink-2);font-weight:500}
.step .nt{font-size:14px;color:var(--ink-3);margin-top:2px}
.step.done .nm{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.tbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--surface-2);font-family:var(--mono);font-size:12px;font-weight:500;color:var(--ink);white-space:nowrap}
.tbtn:hover{background:var(--line)}

.ramp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px;margin-top:12px}
.ramp h3{margin:0 0 2px;font-size:15px;font-weight:500}
.ramp p{margin:0 0 12px;font-size:13px;color:var(--ink-3)}
.ramprow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rs{background:var(--surface-2);border-radius:10px;padding:8px 8px;text-align:center;min-width:0}
.rs b{display:block;font-family:var(--display);font-size:22px;font-weight:600;line-height:1}
.rs span{font-size:12px;color:var(--ink-2);display:block;margin-top:4px;overflow-wrap:anywhere}

/* exercise cards */
.exlist{display:grid;gap:12px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;transition:border-color .3s,transform .3s;position:relative}
.ex.complete{border-color:var(--c)}
.ex.complete::after{content:"Cleared";position:absolute;top:14px;right:-30px;transform:rotate(35deg);background:var(--c);color:var(--on-c);font-family:var(--display);font-weight:600;font-size:11px;letter-spacing:.02em;padding:2px 36px;pointer-events:none}
.ex{overflow:hidden}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.exh>div{min-width:0}.exh>div:first-child{flex:1 1 auto}.exh>.presc{flex:none}
.kind{font-family:var(--display);font-weight:500;font-size:14px;color:var(--ink-3)}
.ex h3{margin:2px 0 0;font-size:19px;font-weight:500;line-height:1.2}
.presc{font-family:var(--display);font-weight:600;font-size:26px;line-height:1;white-space:nowrap;text-align:right;flex:none}
.ex.complete .presc{margin-right:24px}
.presc small{display:block;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-3);margin-top:4px}
.cue{margin:0;font-size:15px;color:var(--ink-2)}
.exf{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.set{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);font-family:var(--display);font-weight:600;font-size:18px;color:var(--ink-2);display:grid;place-items:center;transition:background .2s,border-color .2s,color .2s;position:relative}
.set:hover{border-color:var(--ink-3)}
.set.next{border-color:var(--c);color:var(--ink)}
.set.next::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent)}
.set.on{background:var(--c);border-color:var(--c);color:var(--on-c);animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.kg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.kg input{width:76px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px;text-align:right}
.last{font-size:13px;color:var(--ink-3)}
.last b{color:var(--ink-2);font-weight:500}
.prb{display:inline-block;background:var(--gold);color:#12161C;font-family:var(--display);font-weight:600;font-size:12px;letter-spacing:.08em;padding:1px 8px;border-radius:4px;margin-right:8px;animation:stamp .5s var(--ease)}

/* finisher wheel */
.wheelcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;display:grid;gap:16px;justify-items:center;text-align:center}
.wheelcard p{margin:0;font-size:14px;color:var(--ink-2);max-width:42ch}
.wheelbox{position:relative;width:240px;max-width:100%;aspect-ratio:1}
.wheelbox svg.wheel{width:100%;height:100%;display:block;transition:transform 3.6s cubic-bezier(.12,.85,.22,1)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-top:22px solid var(--ink);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));z-index:2}
.pointer.tick{animation:tick .12s}
@keyframes tick{50%{transform:translateX(-50%) rotate(-14deg)}}
.hub{position:absolute;inset:38%;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:var(--bg);font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.04em;box-shadow:0 0 0 5px var(--surface)}
.finres{width:100%;background:var(--surface-2);border-radius:12px;padding:12px 16px;text-align:left;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;animation:viewin .4s both}
.finres b{display:block;font-size:16px}
.finres span{font-size:14px;color:var(--ink-2)}
.finres.done .cb{background:var(--c);border-color:var(--c)}
.finres.done .cb svg{opacity:1;transform:scale(1)}

/* run */
.runcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;display:grid;gap:16px}
.runcard h3{margin:0;font-family:var(--display);font-weight:600;font-size:28px;line-height:1.05;text-wrap:balance}
.runcard .sub{margin:4px 0 0;color:var(--ink-2);font-size:15px}
.segbar{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;background:var(--surface)}
.seg{min-width:3px;transform-origin:left;animation:grow .7s var(--ease) both}
@keyframes grow{from{transform:scaleX(.4);opacity:.5}to{transform:none;opacity:1}}
.k-walk{background:var(--walk)} .k-jog{background:var(--jog)} .k-run{background:var(--green)} .k-hard{background:var(--red)} .k-tempo{background:var(--yellow)} .k-stride{background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:12px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-weight:600;font-size:26px;line-height:1}
.stat span{display:block;font-size:12px;line-height:1.3;margin-top:4px;color:var(--ink-3)}
.effort{display:grid;gap:8px}
.eff{display:grid;grid-template-columns:12px 1fr;gap:12px;font-size:14px;color:var(--ink-2)}
.eff i{width:12px;height:12px;border-radius:3px;margin-top:4px}
.eff b{color:var(--ink);font-weight:500}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.runcard .btnrow{justify-content:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.doneb{background:var(--c);color:var(--on-c)}
.btn:disabled{opacity:.4;cursor:default}

function calc(L,wi){const s=SESS[WEEK[wi].s];const r={xp:0,done:0,sets:0,allSets:false,total:totalW(wi)};if(!L){r.pct=0;return r;}
  const st=cnt(L.warm)+cnt(L.cool);r.done+=st;r.xp+=st*XP.step;

function trend(){const list=bwList();const t={list,last:null,cur:null,rate:null,best:Infinity};if(!list.length)return t;
  t.last=list[list.length-1];t.cur=avgAt(t.last.d,list);const prev=avgAt(addDays(t.last.d,-7),list);
  if(prev&&prev.n>=3&&t.cur.n>=3)t.rate=t.cur.v-prev.v;

const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim()||"#E2AA12";
function confetti(x,y,n=40,power=9){if(reduced)return;const cols=["--red","--blue","--yellow","--green","--gold","--violet"].map(cssv);
  for(let k=0;k<n;k++){const a=Math.random()*Math.PI*2,sp=Math.random()*power+2;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-power*.6,r:Math.random()*5+3,c:cols[k%cols.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,sh:k%3,life:1});}
  if(!fxRun){fxRun=true;requestAnimationFrame(loopFx);}}
function loopFx(){ctx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(p=>p.life>0&&p.y<innerHeight+30);
  parts.forEach(p=>{p.vy+=.32;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;p.life-=.008;ctx.save();ctx.globalAlpha=Math.min(1,p.life*2);ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
    if(p.sh===0)ctx.fillRect(-p.r,-p.r/2.4,p.r*2,p.r/1.2);else if(p.sh===1){ctx.beginPath();ctx.arc(0,0,p.r*.7,0,7);ctx.fill();}else{ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.arc(0,0,p.r*.35,0,7,true);ctx.fill();}ctx.restore();});
  if(parts.length)requestAnimationFrame(loopFx);else{fxRun=false;ctx.clearRect(0,0,innerWidth,innerHeight);}}
function center(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}
function floatAt(el,text,cls=""){const [x,y]=center(el);const f=document.createElement("div");f.className="fl "+cls;f.textContent=text;f.style.left=x+"px";f.style.top=y+"px";document.getElementById("floats").appendChild(f);setTimeout(()=>f.remove(),1200);}
function toast(title,body,ic){const t=document.createElement("div");t.className="toast";t.innerHTML=`<span class="m">${icon(ic||"star",22)}</span><div><b>${title}</b><span>${body}</span></div>`;document.getElementById("toasts").appendChild(t);setTimeout(()=>t.remove(),4000);}
const MQ=[];function modal(html,after){MQ.push({html,after});if(MQ.length===1)showModal();}
function showModal(){const m=MQ[0],el=document.getElementById("modal");el.innerHTML=`<div class="mcard" role="dialog" aria-modal="true">${m.html}<button class="btn" id="mclose">Back to it</button></div>`;el.hidden=false;
  document.getElementById("mclose").focus();document.getElementById("mclose").onclick=closeModal;if(m.after)m.after();}
function closeModal(){document.getElementById("modal").hidden=true;MQ.shift();if(MQ.length)setTimeout(showModal,250);}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});

/* audio */
let AC=null,wake=null;
function unlockAudio(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){}}
function tone(f,d,len,type="sine",vol=.2){if(S.mute)return;try{unlockAudio();if(!AC)return;const t=AC.currentTime+d,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+len+.05);}catch(e){}}
const blip=(m=1)=>tone(520*m,0,.12,"triangle",.18);
function chime(big){(big?[[660,0],[880,.15],[1320,.3]]:[[880,0],[1175,.14]]).forEach(([f,d])=>tone(f,d,1,"sine",.2));try{navigator.vibrate&&navigator.vibrate(big?[150,80,150,80,150]:[120,60,120]);}catch(e){}}
function fanfare(){[[523,0],[659,.12],[784,.24],[1047,.4],[784,.56],[1047,.7]].forEach(([f,d])=>tone(f,d,.5,"triangle",.18));}
function thud(){tone(110,0,.25,"square",.12);tone(70,.02,.3,"sine",.25);}
async function keepAwake(on){try{if(on&&!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request("screen");}else if(!on&&wake){await wake.release();wake=null;}}catch(e){wake=null;}}
function paintMute(){const b=document.getElementById("mute");b.innerHTML=S.mute?'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 9h4l5-4v14l-5-4H4zM17 9l5 6M22 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 9h4l5-4v14l-5-4H4zM17 8a5 5 0 0 1 0 8M19.5 5.5a9 9 0 0 1 0 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';b.setAttribute("aria-label",S.mute?"Sound off":"Sound on");b.setAttribute("aria-pressed",!!S.mute);}

/* ================= COMMIT (game loop) ================= */
let combo=0,lastSetT=0;
function commit(prev,el,opt={}){save();const st=stats();ST=st;const gain=st.xp-prev.xp;
  if(gain>0&&el){floatAt(el,`+${gain} XP`);blip(opt.pitch||1);}
  if(st.boss.dmg>prev.boss.dmg){const av=document.querySelector("#bossCard .bav");const hm=document.getElementById("hBoss");
    [av,hm].forEach(x=>{if(!x)return;x.classList.remove("hit");void x.offsetWidth;x.classList.add("hit");});
    floatAt(av&&av.getBoundingClientRect().top>0?av:hm,`-${st.boss.dmg-prev.boss.dmg} HP`,"dmg");}
  updateHUD(st);refreshProgress();
  const pNow=calcI(sel).pct;
  if(pNow>=100&&opt.prevPct<100){perfectDay();}
  if(st.boss.hp===0&&prev.boss.hp>0&&!S.slain[WK]){S.slain[WK]=BOSS.n;save();Object.assign(st,stats());ST=st;bossDown();}
  if(st.kilos>(prev.kilos||0))kiloDown(KILOS[st.kilos-1]);
  if(st.lvl>(S.lvl||1)){const from=S.lvl||1;S.lvl=st.lvl;save();levelUp(from,st);const lv=document.getElementById("hLvl");lv.classList.remove("bump");void lv.offsetWidth;lv.classList.add("bump");}
  else if(st.lvl<S.lvl){S.lvl=st.lvl;save();}
  const fresh=st.ach.filter(a=>!S.ach.includes(a));if(fresh.length){fresh.forEach((id,k)=>setTimeout(()=>{const a=ACH.find(x=>x.id===id);toast("Achievement unlocked",a.n,a.ic);chime(false);},k*700+300));S.ach=[...new Set([...S.ach,...fresh])];save();}}
const snapPrev=()=>({xp:ST.xp,boss:{...ST.boss},lvl:ST.lvl,kilos:ST.kilos});
function perfectDay(){const h=document.querySelector(".hero");if(h&&!h.querySelector(".stamp")){const s=document.createElement("div");s.className="stamp fresh";s.textContent="Perfect day";h.appendChild(s);}
  confetti(innerWidth/2,innerHeight*.35,110,13);fanfare();toast("Perfect day",`+${XP.perfect} XP bonus. Every item cleared.`,"star");}
function bossDown(){thud();setTimeout(fanfare,250);confetti(innerWidth/2,innerHeight*.4,140,14);
  modal(`<div class="eyebrow">Weekly boss defeated</div><div style="width:130px;height:130px">${bossSVG(BOSS,0,true)}</div><h2>K.O.</h2><p><b>${BOSS.n}</b>. ${BOSS.dead} Trophy added to your cabinet.</p>`);}
function kiloDown(k){thud();setTimeout(fanfare,250);confetti(innerWidth/2,innerHeight*.4,120,13);
  modal(`<div class="eyebrow">Kilo boss defeated</div><div style="width:120px;height:120px">${bossSVG(k,0,true)}</div><h2>${k.kg} kg</h2><p><b>${k.n}</b> is down. ${k.d} +${XP.kilo} XP.</p>`);}
function levelUp(from,st){fanfare();setTimeout(()=>confetti(innerWidth/2,innerHeight*.45,120,12),300);
  const r=rankOf(st.bar),pr=rankOf(barKg(from));
  modal(`<div class="eyebrow">Level up</div><h2>Lv ${st.lvl}</h2>${barbellSVG(st.bar,true)}<p>Your bar is now loaded to <b>${st.bar} kg</b>.${r!==pr?` Welcome to the <b>${r}</b>.`:` Next plate at ${need(st.lvl+1).toLocaleString()} XP.`}</p>`);}

function renderHeader(){document.getElementById("wkLbl").textContent=`Wk ${S.week}/${WEEKS}`;
  document.getElementById("wkPrev").disabled=S.week<=1;document.getElementById("wkNext").disabled=S.week>=WEEKS;
  document.getElementById("plates").innerHTML=WEEK.map((w,i)=>{const s=sessOf(i);const pc=calcI(i).pct;
    const mark=pc>=100?`<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="m3 7.2 2.6 2.6L11 4.4" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`:(i===todayIdx?"<i></i>":"");
    return `<button class="plate ${i===sel?"sel":""} ${pc>=100?"full":""}" data-day="${i}" aria-label="${w.full}, ${s.name}" aria-pressed="${i===sel}"><span class="disc" style="--pc:${COLORS[s.color]}"></span><span class="d">${w.d}</span><span class="n">${mark}${dateOf(i).getDate()}</span></button>`;}).join("");}
function refreshPlates(){document.querySelectorAll(".plate").forEach((p,i)=>{const pc=calcI(i).pct;p.classList.toggle("full",pc>=100);
  p.querySelector(".n").innerHTML=(pc>=100?`<svg width="11" height="11" viewBox="0 0 14 14" fill="none"><path d="m3 7.2 2.6 2.6L11 4.4" stroke="var(--gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`:(i===todayIdx?"<i></i>":""))+dateOf(i).getDate();p.style.animation="none";});}

function bossCard(){const b=ST.boss,f=b.max?b.hp/b.max:1;
  return `<section class="boss ${b.hp===0?"dead":""}" id="bossCard"><div class="bav">${bossSVG(BOSS,f,b.hp===0)}</div>
  <div class="bmeta"><div class="eyebrow">Boss of the week</div><h3>${BOSS.n}</h3><div class="hp"><em style="width:${f*100}%"></em><i style="width:${f*100}%"></i></div>
  <div class="hpt"><span class="hpv mono">${b.hp} / ${b.max} HP</span><span>Every item you clear hits it</span></div><div class="taunt">${b.hp===0?BOSS.dead:`"${taunt(f)}"`}</div></div></section>`;}
function stepList(list,group,i){const L=getLog(i,false)||{};const store=L[group]||{};
  return `<ul class="steps">${list.map((st,j)=>`<li class="step ${store[j]?"done":""}" data-group="${group}" data-j="${j}">
    <button class="cb" data-act="step" aria-label="Mark ${st.n} done" aria-pressed="${!!store[j]}">${CHECK}</button>
    <div class="txt"><div class="nm">${st.n}<span class="ds">${st.ds}</span></div>${st.nt?`<div class="nt">${st.nt}</div>`:""}</div>
    ${st.t?`<button class="tbtn" data-act="steptimer" data-t="${st.t}" data-n="${st.n.replace(/"/g,"&quot;")}">${PLAY}${fmt(st.t)}</button>`:"<span></span>"}</li>`).join("")}</ul>`;}
function rampHTML(e,i){const base=todayW(e.id,i)||lastW(e.id,i);const r=v=>Math.max(e.bar?20:2.5,Math.round(v/2.5)*2.5);let rows;
  if(e.bar)rows=base?[["10","Empty bar"],["6",r(base*.5)+" kg"],["3",r(base*.7)+" kg"],["1",r(base*.85)+" kg"]]:[["10","Empty bar"],["6","50% of working"],["3","70%"],["1","85%"]];
  else rows=base?[["10","Light"],["6",r(base*.6)+" kg"],["3",r(base*.8)+" kg"],["1",r(base*.9)+" kg"]]:[["10","Light"],["6","60% of working"],["3","80%"],["1","90%"]];
  return `<div class="ramp"><h3>Ramp-up sets: ${e.n.toLowerCase()}</h3><p>${base?`Based on ${base} kg working weight. `:"Log a working weight below and these turn into kg. "}About a minute between them. They don't count as working sets.</p>
  <div class="ramprow">${rows.map(x=>`<div class="rs"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("")}</div></div>`;}
function nextSet(i){const s=sessOf(i);if(s.type!=="lift")return null;const L=getLog(i,false);for(const e of s.ex){const a=(L&&L.sets[e.id])||[];for(let k=0;k<e.sets;k++)if(!a[k])return e.id+":"+k;}return null;}
function exCard(e,i,nx){const L=getLog(i,false);const done=(L&&L.sets[e.id])||[];const all=done.slice(0,e.sets).filter(Boolean).length===e.sets;
  const kind=e.k==="c"?"Compound":e.k==="i"?"Isolation":"Core";const rir=e.k==="c"?"Stop 1-2 reps short of failure":e.k==="i"?"Stop 0-1 reps short of failure":"Quality over time";
  const xp=e.k==="c"?XP.setC:e.k==="i"?XP.setI:XP.setX;const lw=lastW(e.id,i),bw=bestW(e.id,i);const pr=isPR(e.id,i);
  const tip=e.k==="c"?"Hit 8 on every set? Add 2.5 kg next time.":e.k==="i"?"Top of the range on every set? Go up a step.":"";
  return `<article class="ex ${all?"complete":""}" data-ex="${e.id}">
    <div class="exh"><div><div class="kind">${kind} · +${xp} XP a set</div><h3>${e.n}</h3></div><div class="presc">${e.sets} × ${e.reps}<small>rest ${fmt(e.rest)}</small></div></div>
    <p class="cue">${e.cue}</p>
    <div class="exf"><div class="sets" role="group" aria-label="Sets for ${e.n}">${Array.from({length:e.sets},(_,k)=>`<button class="set ${done[k]?"on":""} ${nx===e.id+":"+k?"next":""}" data-act="set" data-k="${k}" aria-pressed="${!!done[k]}" aria-label="Set ${k+1}">${done[k]?CHECK:k+1}</button>`).join("")}</div>
    ${e.k!=="x"?`<label class="kg"><input id="kg-${e.id}" type="number" inputmode="decimal" step="0.5" min="0" placeholder="${lw??"0"}" value="${todayW(e.id,i)}" data-act="kg" aria-label="Weight in kg for ${e.n}">kg</label>`:""}</div>
    <div class="last">${pr?`<span class="prb">PR</span>`:""}${rir}.${e.k!=="x"?` ${bw!=null?`Best <b>${bw} kg</b>, beat it for +${XP.pr} XP. `:""}${tip}`:""}</div></article>`;}
function wheelSVG(list){const n=list.length,seg=360/n,cols=["var(--red)","var(--blue)","var(--yellow)","var(--green)"],tx=["#fff","#fff","#12161C","#fff"];let g="";
  const pt=(a,r)=>[100+r*Math.sin(a*Math.PI/180),100-r*Math.cos(a*Math.PI/180)];
  list.forEach((f,k)=>{const a0=k*seg-seg/2,a1=k*seg+seg/2;const [x0,y0]=pt(a0,98),[x1,y1]=pt(a1,98);const [lx,ly]=pt(k*seg,66);
    g+=`<path d="M100 100L${x0} ${y0}A98 98 0 0 1 ${x1} ${y1}Z" fill="${cols[k%4]}" stroke="var(--surface)" stroke-width="2"/><text x="${lx}" y="${ly}" transform="rotate(${k*seg} ${lx} ${ly})" text-anchor="middle" dominant-baseline="middle" fill="${tx[k%4]}" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="13" letter-spacing=".5">${f.s.toUpperCase()}</text>`;});
  return g;}
let wheelRot=0;
function finisherHTML(i){const s=sessOf(i),list=finList(WEEK[i].s),L=getLog(i,false)||{};const has=L.fin!=null;
  if(has)wheelRot=360*3-L.fin*(360/list.length);else wheelRot=0;
  return `<div class="wheelcard"><p>Optional bonus. One spin a day, no rerolls. Whatever it lands on, you do it.</p>
    <div class="wheelbox"><div class="pointer" id="pointer"></div><svg class="wheel" id="wheel" viewBox="0 0 200 200" style="transform:rotate(${wheelRot}deg);transition:none">${wheelSVG(list)}</svg><div class="hub">+${XP.fin}</div></div>
    ${has?finRes(list[L.fin],L.finDone):`<button class="btn" data-act="spin">${PLAY} Spin the plate</button>`}</div>`;}
const finRes=(f,done)=>`<div class="finres ${done?"done":""}" id="finres"><button class="cb" data-act="findone" aria-pressed="${!!done}" aria-label="Mark finisher done">${CHECK}</button><div><b>${f.n}</b><span>${f.d}</span></div><span class="xpt">+${XP.fin} XP</span></div>`;
function questHTML(i){const L=getLog(i,false)||{basics:{}};const k=dkey(dateOf(i));const qi=(hashStr(k)+(L.rr||0)*5)%QUESTS.length;const b=L.basics||{};
  const row=(act,key,on,title,sub,xp,extra="")=>`<div class="quest ${on?"done":""}" data-q="${key}"><button class="cb" data-act="${act}" data-b="${key}" aria-pressed="${!!on}" aria-label="Mark ${title} done">${CHECK}</button><div class="qt"><b>${title}</b><span>${sub}</span></div><div class="qside">${extra}<span class="xpt">+${xp}</span></div></div>`;
  return `<div class="quests">${row("basic","protein",b.protein,"130 g protein","Daily quest",XP.basic)}${row("basic","steps",b.steps,"8k steps","Daily quest",XP.basic)}
   ${row("quest","side",L.questDone,QUESTS[qi],L.rr?"Side quest (rerolled)":"Side quest · one reroll a day",XP.quest,`<button class="dice" data-act="reroll" aria-label="Reroll side quest" ${L.rr||L.questDone?"disabled":""}>${DIE}</button>`)}${weighRow(i)}${habitRows(i,L,row)}</div>`;}
function weighRow(i){const k=dkey(dateOf(i));const v=S.bw[k];const t=trend();
  return `<div class="quest ${v!=null?"done":""}" data-q="bw"><span class="cb" aria-hidden="true">${CHECK}</span><div class="qt"><b>Morning weigh-in</b><span class="bwsub">${t.cur?`7-day average ${t.cur.v.toFixed(1)} kg`:"Fasted, after the toilet"}</span></div><div class="qside"><label class="qin"><input id="bw-${k}" type="number" inputmode="decimal" step="0.1" min="30" max="250" placeholder="${t.last?t.last.kg:GOAL.startKg}" value="${v??""}" data-act="bw" data-day="${i}" aria-label="Morning weight in kg">kg</label><span class="xpt">+${XP.weigh}</span></div></div>`;}
function habitRows(i,L,row){return TIPS.filter(x=>!x.once&&S.habits[x.id]&&(x.w==null||x.w===i)).map(x=>row("habit",x.id,L.habits&&L.habits[x.id],x.h,"1% habit",XP.habit).replace('class="quest','class="quest habit')).join("");}
function runHTML(s,i){const {p,segs}=runPlan(s.run);const L=getLog(i,false);const total=segs.reduce((a,x)=>a+x[1],0);const work=segs.filter(x=>x[2]!=="walk").reduce((a,x)=>a+x[1],0);const kinds=[...new Set(segs.map(x=>x[2]))];
  return `<div class="runcard"><div><div class="kind">Week ${S.week} of ${WEEKS} · +${XP.run} XP</div><h3>${p.t}</h3><p class="sub">${s.run==="easy"?"Build time on feet. Walk breaks are part of the plan, not a failure.":(S.week<=2?"Weeks 1 and 2 stay gentle on purpose. Strides teach fast, relaxed form.":"The hard part is short. Keep the easy parts truly easy.")}</p></div>
    <div class="segbar" aria-label="Session structure">${segs.map((x,k)=>`<div class="seg k-${x[2]}" style="flex:${x[1]} 1 0;animation-delay:${Math.min(k*25,600)}ms" title="${x[0]} ${fmt(x[1])}"></div>`).join("")}</div>
    <div class="legend">${kinds.map(k=>`<span><i style="background:${EFFORT[k][0]}"></i>${EFFORT[k][1]}</span>`).join("")}</div>
    <div class="stats"><div class="stat"><b class="mono">${fmtMin(total)}</b><span>total min</span></div><div class="stat"><b class="mono">${fmtMin(work)}</b><span>min moving</span></div><div class="stat"><b class="mono">${segs.length}</b><span>blocks</span></div></div>
    <div class="effort">${kinds.map(k=>`<div class="eff"><i style="background:${EFFORT[k][0]}"></i><div><b>${EFFORT[k][1]}.</b> ${EFFORT[k][2]}</div></div>`).join("")}</div>
    <div class="btnrow"><button class="btn" data-act="runtimer">${PLAY} Start interval timer</button><button class="btn ${L&&L.run?"doneb":"ghost"}" data-act="rundone" aria-pressed="${!!(L&&L.run)}">${L&&L.run?CHECK+" Run done":"Mark run done"}</button></div>
    <p class="warn">Shin, knee or Achilles pain above 3 out of 10, or getting worse during the run? Stop, walk home, and repeat this week next time.</p></div>`;}
function medHTML(i){const m=MED[WEEK[i].med];const L=getLog(i,false);const done=L&&L.med;
  return `<div class="med" id="med"><div><h3>${m.name} · +${XP.med} XP</h3><p class="how">${m.how}</p></div>
    <div class="orbwrap">${ring(done?100:0,210,6,"var(--c)","medRing")}<div class="orb" id="orb"><span class="ph" id="medPh">${done?"Done":"Ready"}</span></div></div>

function renderToday(){const i=sel,w=WEEK[i],s=sessOf(i);const d=dateOf(i);const r=calcI(i);const c=COLORS[s.color];
  const sets=s.type==="lift"?s.ex.reduce((a,e)=>a+e.sets,0):0;const nx=nextSet(i);

  else if(s.type==="run"){html+=`<section class="sec"><div class="sech"><h2>Warm-up</h2><span>8 min · +${XP.step} XP each</span></div>${stepList(WARM_RUN,"warm",i)}</section>

  else html+=`<section class="sec"><div class="sech"><h2>Move</h2><span>${i===6?"optional":"30-45 min"}</span></div>${stepList(MOBILITY,"warm",i)}</section>`;

    <li><b>Keep the hard run away from leg day,</b> ideally with a day between them.</li></ul></div>
  <div class="card rule"><h3><i style="background:var(--gold)"></i>How you score</h3><div class="xptable">
    <span>Warm-up or cool-down step</span><b>+${XP.step}</b><span>Compound set</span><b>+${XP.setC}</b><span>Isolation set</span><b>+${XP.setI}</b><span>Core set</span><b>+${XP.setX}</b>
    <span>Every set of an exercise cleared</span><b>+${XP.exBonus}</b><span>New PR on a lift</span><b>+${XP.pr}</b><span>Run done</span><b>+${XP.run}</b><span>Meditation</span><b>+${XP.med}</b>
    <span>Protein or steps quest</span><b>+${XP.basic}</b><span>Side quest</span><b>+${XP.quest}</b><span>Finisher wheel</span><b>+${XP.fin}</b><span>Perfect day</span><b>+${XP.perfect}</b>
    <span>Morning weigh-in</span><b>+${XP.weigh}</b><span>Adopted 1% habit, each day</span><b>+${XP.habit}</b><span>One-time 1% action</span><b>+${XP.once}</b><span>Photo check-in</span><b>+${XP.checkin}</b><span>Kilo boss defeated</span><b>+${XP.kilo}</b></div>
    <ul style="margin-top:14px"><li><b>Streak:</b> a day counts when you meditate or clear half the day. Rest days keep it alive.</li><li><b>Weekly boss:</b> clear 80% of the week's items to knock it out.</li><li><b>Levels:</b> each one loads 5 kg onto your bar. 60 kg is the One-Plate Club, 100 kg the Two-Plate Club.</li></ul></div>
  <div class="card rule"><h3><i style="background:var(--blue)"></i>Sample week</h3><div class="sample">${WEEK.map((w,i)=>`<b>${w.d}</b><span>${sessOf(i).name}</span>`).join("")}</div>
    <p class="warn" style="margin-top:12px">Tuesday is gym closure, so it carries the easy run.</p></div></div></div>`;}

/* ================= RENDER ================= */
function render(){stopMed();renderHeader();const v=document.getElementById("view");
  v.innerHTML=tab==="today"?renderToday():tab==="week"?renderWeek():tab==="progress"?renderProgress():tab==="trophies"?renderTrophies():renderRules();
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));updateHUD(ST);}
function refreshProgress(){const r=calcI(sel);const ring=document.getElementById("dayRing");
  if(ring){const c=+ring.getAttribute("stroke-dasharray");ring.setAttribute("stroke-dashoffset",c*(1-r.pct/100));}
  const t=document.getElementById("dayPct");if(t)t.textContent=r.pct;const x=document.getElementById("dayXp");if(x)x.textContent=r.xp;
  const nx=nextSet(sel);document.querySelectorAll(".set").forEach(b=>{const id=b.closest(".ex").dataset.ex;b.classList.toggle("next",nx===id+":"+b.dataset.k);});
  refreshPlates();}

/* ================= TIMER ================= */
const T={q:[],i:0,end:0,dur:0,left:0,paused:false,title:"",onDone:null,int:null,beep:-1};
const KCOL={walk:"var(--walk)",jog:"var(--jog)",run:"var(--green)",stride:"var(--red)",hard:"var(--red)",tempo:"var(--yellow)",rest:"var(--gold)"};
function startQueue(title,segs,onDone){T.q=segs;T.i=0;T.title=title;T.onDone=onDone||null;document.getElementById("timer").hidden=false;beginSeg();clearInterval(T.int);T.int=setInterval(tick,200);keepAwake(true);}
function beginSeg(){const s=T.q[T.i];T.dur=s[1]*1000;T.end=Date.now()+T.dur;T.paused=false;T.beep=-1;document.getElementById("tPause").textContent="Pause";
  document.getElementById("tTitle").textContent=T.title+(T.q.length>1?` · ${T.i+1} of ${T.q.length}`:"");document.getElementById("tSeg").textContent=s[0];const nx=T.q[T.i+1];
  document.getElementById("tNext").textContent=nx?`Next: ${nx[0]} ${fmt(nx[1])}`:(T.q.length>1?"Last block":"");document.getElementById("tBar").style.setProperty("--tc",KCOL[s[2]]||"var(--gold)");tick();}
function tick(){if(T.paused)return;const left=T.end-Date.now();
  if(left<=0){T.i++;if(T.i>=T.q.length){chime(true);const cb=T.onDone;closeTimer();if(cb)cb();return;}chime(false);beginSeg();return;}
  const sec=Math.ceil(left/1000);const cl=document.getElementById("tClock");cl.textContent=fmt(sec);
  if(sec<=3&&sec!==T.beep){T.beep=sec;tone(740,0,.09,"square",.08);cl.classList.remove("urgent");void cl.offsetWidth;cl.classList.add("urgent");}else if(sec>3)cl.classList.remove("urgent");
  document.getElementById("tBar").style.width=(100*(1-left/T.dur))+"%";}
function closeTimer(){clearInterval(T.int);T.int=null;document.getElementById("timer").hidden=true;if(!M.running)keepAwake(false);}
document.getElementById("tPause").onclick=()=>{if(!T.paused){T.left=T.end-Date.now();T.paused=true;document.getElementById("tPause").textContent="Resume";}else{T.end=Date.now()+T.left;T.paused=false;document.getElementById("tPause").textContent="Pause";tick();}};
document.getElementById("tAdd").onclick=()=>{if(T.paused)T.left+=15000;else T.end+=15000;T.dur+=15000;tick();};
document.getElementById("tSkip").onclick=()=>{T.i++;if(T.i>=T.q.length){const cb=T.onDone;closeTimer();if(cb)cb();return;}beginSeg();};
document.getElementById("tClose").onclick=closeTimer;

/* ================= MEDITATION ================= */
const M={running:false,total:300000,left:300000,end:0,int:null,to:null,pi:0,count:0,day:null};
function setPhase(){const m=MED[WEEK[M.day].med];const ph=m.ph[M.pi%m.ph.length];const orb=document.getElementById("orb");if(!orb)return;
  document.getElementById("medPh").textContent=ph[0];orb.style.transitionDuration=ph[1]+"s";if(ph[2]==="in")orb.style.transform="scale(1)";else if(ph[2]==="out")orb.style.transform="scale(.62)";
  if(ph[2]==="in")tone(392,0,.6,"sine",.05);
  if(m.count&&ph[2]==="out"){M.count=M.count%10+1;document.getElementById("medPrompt").textContent="Count: "+M.count;}
  M.to=setTimeout(()=>{M.pi++;setPhase();},ph[1]*1000);}
function medTick(){const left=M.end-Date.now();const m=MED[WEEK[M.day].med];const el=document.getElementById("medTime");if(!el){stopMed();return;}
  if(left<=0){finishMed();return;}M.left=left;el.textContent=fmt(Math.ceil(left/1000));
  const r=document.getElementById("medRing");if(r){const c=+r.getAttribute("stroke-dasharray");r.setAttribute("stroke-dashoffset",c*(left/M.total));}
  if(m.prompts){const idx=Math.min(m.prompts.length-1,Math.floor((M.total-left)/(M.total/m.prompts.length)));const p=document.getElementById("medPrompt");if(p&&p.dataset.i!=idx){p.dataset.i=idx;p.style.opacity=0;setTimeout(()=>{p.textContent=m.prompts[idx];p.style.opacity=1;},350);}}}
function startMed(){unlockAudio();if(M.day!==sel||M.left<=0){M.left=M.total;M.count=0;}M.day=sel;M.running=true;M.end=Date.now()+M.left;M.pi=0;
  document.getElementById("medGo").innerHTML="Pause";setPhase();clearInterval(M.int);M.int=setInterval(medTick,250);medTick();keepAwake(true);}
function pauseMed(){M.running=false;clearInterval(M.int);clearTimeout(M.to);M.left=M.end-Date.now();const orb=document.getElementById("orb");
  if(orb){orb.style.transitionDuration=".8s";orb.style.transform="scale(.75)";document.getElementById("medPh").textContent="Paused";}const g=document.getElementById("medGo");if(g)g.innerHTML=PLAY+" Resume";}
function stopMed(){clearInterval(M.int);clearTimeout(M.to);M.running=false;M.left=M.total;M.count=0;if(!T.int)keepAwake(false);}
function finishMed(){const day=M.day;stopMed();chime(true);const prev=snapPrev(),pp=calcI(day).pct;const L=getLog(day);const was=L.med;L.med=true;
  const orb=document.getElementById("orb");if(orb){orb.style.transitionDuration="1.2s";orb.style.transform="scale(1)";document.getElementById("medPh").textContent="Done";}
  document.getElementById("medTime").textContent="0:00";const g=document.getElementById("medGo");if(g)g.innerHTML=PLAY+" Sit again";
  const tag=document.querySelector(".medtag");if(tag)tag.textContent="Completed today. A star lit in this week's constellation.";
  if(orb&&!was){const [x,y]=center(orb);confetti(x,y,50,8);}commit(prev,was?null:orb,{prevPct:pp});}
function resetMed(){stopMed();const orb=document.getElementById("orb");if(!orb)return;orb.style.transitionDuration=".8s";orb.style.transform="scale(.62)";
  document.getElementById("medPh").textContent="Ready";document.getElementById("medTime").textContent="5:00";const r=document.getElementById("medRing");if(r){const c=+r.getAttribute("stroke-dasharray");r.setAttribute("stroke-dashoffset",c);}
  const m=MED[WEEK[sel].med];document.getElementById("medPrompt").textContent=m.prompts?m.prompts[0]:m.count?"Count: 1":"";document.getElementById("medGo").innerHTML=PLAY+" Start";}

/* ================= EVENTS ================= */
document.addEventListener("pointerdown",unlockAudio,{once:true});
document.getElementById("mute").onclick=()=>{S.mute=!S.mute;save();paintMute();if(!S.mute)blip();};
document.getElementById("wkPrev").onclick=()=>{if(S.week>1){const p=snapPrev();S.week--;render();commit(p,null,{prevPct:101});}};
document.getElementById("wkNext").onclick=()=>{if(S.week<WEEKS){const p=snapPrev();S.week++;render();commit(p,null,{prevPct:101});}};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:"smooth"});});
document.querySelectorAll("[data-tabgo]").forEach(b=>b.onclick=()=>{tab=b.dataset.tabgo;render();window.scrollTo({top:0,behavior:"smooth"});});
document.getElementById("plates").addEventListener("click",e=>{const b=e.target.closest("[data-day]");if(!b)return;sel=+b.dataset.day;tab="today";render();});
addEventListener("scroll",()=>document.getElementById("hud").classList.toggle("stuck",scrollY>70),{passive:true});

document.getElementById("view").addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");if(go){sel=+go.dataset.day;tab="today";render();window.scrollTo({top:0,behavior:"smooth"});return;}
  const b=e.target.closest("[data-act]");if(!b)return;const act=b.dataset.act;const i=sel;const prev=snapPrev();const pp=calcI(i).pct;
  if(act==="step"){const li=b.closest(".step");const g=li.dataset.group,j=li.dataset.j;const L=getLog(i);L[g]=L[g]||{};L[g][j]=!L[g][j];
    li.classList.toggle("done",L[g][j]);b.setAttribute("aria-pressed",L[g][j]);commit(prev,b,{prevPct:pp});}
  else if(act==="steptimer"){unlockAudio();startQueue(b.dataset.n,[[b.dataset.n,+b.dataset.t,"rest"]]);}
  else if(act==="set"){const card=b.closest(".ex");const id=card.dataset.ex;const exo=sessOf(i).ex.find(x=>x.id===id);const k=+b.dataset.k;
    const L=getLog(i);L.sets[id]=L.sets[id]||[];L.sets[id][k]=!L.sets[id][k];const on=L.sets[id][k];
    b.classList.toggle("on",on);b.innerHTML=on?CHECK:k+1;b.setAttribute("aria-pressed",on);
    const all=L.sets[id].slice(0,exo.sets).filter(Boolean).length===exo.sets;card.classList.toggle("complete",all);
    let pitch=1;if(on){const t=Date.now();combo=(t-lastSetT<6*60000)?combo+1:1;lastSetT=t;pitch=1+Math.min(combo,12)*.07;
      if(combo>=3)setTimeout(()=>floatAt(card.querySelector(".exh"),`COMBO x${combo}`,"combo"),180);
      if(all){const [x,y]=center(card);confetti(x,y,45,8);setTimeout(()=>chime(false),120);}
      const idx=sessOf(i).ex.indexOf(exo);const nxt=all?sessOf(i).ex[idx+1]:exo;
      startQueue(`Rest after ${exo.n.toLowerCase()}`,[[nxt?`Next: ${nxt.n}`:"Spin the wheel, then cool down",exo.rest,"rest"]]);}
    commit(prev,on?b:null,{prevPct:pp,pitch});}
  else if(act==="basic"){const L=getLog(i);L.basics=L.basics||{};L.basics[b.dataset.b]=!L.basics[b.dataset.b];b.closest(".quest").classList.toggle("done",L.basics[b.dataset.b]);b.setAttribute("aria-pressed",L.basics[b.dataset.b]);commit(prev,b,{prevPct:pp});}
  else if(act==="quest"){const L=getLog(i);L.questDone=!L.questDone;const q=b.closest(".quest");q.classList.toggle("done",L.questDone);b.setAttribute("aria-pressed",L.questDone);
    const d=q.querySelector(".dice");if(d)d.disabled=!!(L.rr||L.questDone);if(L.questDone){const [x,y]=center(b);confetti(x,y,25,6);}commit(prev,b,{prevPct:pp});}
  else if(act==="reroll"){const L=getLog(i);if(L.rr||L.questDone)return;L.rr=1;save();b.classList.add("roll");tone(300,0,.08,"square",.06);tone(420,.12,.08,"square",.06);tone(600,.24,.12,"square",.06);
    setTimeout(()=>{const wrap=b.closest(".sec");wrap.querySelector(".quests").outerHTML=questHTML(i);},650);}
  else if(act==="spin"){const L=getLog(i);if(L.fin!=null)return;const list=finList(WEEK[i].s);const n=list.length,seg=360/n;const k=Math.floor(Math.random()*n);
    L.fin=k;save();b.disabled=true;b.textContent="Spinning...";const w=document.getElementById("wheel");const target=360*6-k*seg+(Math.random()-.5)*seg*.6;
    w.style.transition="";void w.offsetWidth;w.style.transform=`rotate(${target}deg)`;
    let tt=0;const ptr=document.getElementById("pointer");const tickAt=[];for(let q=0;q<26;q++){tt+=40+q*q*.9;tickAt.push(tt);}
    tickAt.forEach(t=>setTimeout(()=>{tone(1200,0,.03,"square",.05);ptr.classList.remove("tick");void ptr.offsetWidth;ptr.classList.add("tick");},t));
    setTimeout(()=>{b.outerHTML=finRes(list[k],false);chime(false);const [x,y]=center(w);confetti(x,y,40,9);},3700);}
  else if(act==="findone"){const L=getLog(i);L.finDone=!L.finDone;const r=b.closest(".finres");r.classList.toggle("done",L.finDone);b.setAttribute("aria-pressed",L.finDone);commit(prev,b,{prevPct:pp});}
  else if(act==="runtimer"){unlockAudio();const s=sessOf(i);const {segs}=runPlan(s.run);
    startQueue(s.name,segs.map(x=>[x[0],x[1],x[2]]),()=>{const p2=snapPrev(),pp2=calcI(i).pct;const L=getLog(i);if(L.run)return;L.run=true;
      const btn=sel===i&&tab==="today"?document.querySelector('[data-act="rundone"]'):null;if(btn){btn.className="btn doneb";btn.innerHTML=CHECK+" Run done";const [x,y]=center(btn);confetti(x,y,60,10);}commit(p2,btn,{prevPct:pp2});});}
  else if(act==="rundone"){const L=getLog(i);L.run=!L.run;b.className="btn "+(L.run?"doneb":"ghost");b.innerHTML=L.run?CHECK+" Run done":"Mark run done";b.setAttribute("aria-pressed",L.run);
    if(L.run){const [x,y]=center(b);confetti(x,y,60,10);}commit(prev,L.run?b:null,{prevPct:pp});}
  else if(act==="habit"){const L=getLog(i);L.habits=L.habits||{};const id=b.dataset.b;L.habits[id]=!L.habits[id];b.closest(".quest").classList.toggle("done",L.habits[id]);b.setAttribute("aria-pressed",L.habits[id]);
    if(L.habits[id]){const [x,y]=center(b);confetti(x,y,18,5);}commit(prev,L.habits[id]?b:null,{prevPct:pp});}
  else if(act==="filter"){tipF=b.dataset.c;document.querySelectorAll(".fchip").forEach(c=>{const on=c.dataset.c===tipF;c.classList.toggle("on",on);c.setAttribute("aria-pressed",on);});document.getElementById("tips").innerHTML=tipsList();blip(1.2);}
  else if(act==="adopt"){const id=b.dataset.id;const tip=TIPS.find(x=>x.id===id);const n=slotsFor(ST.lvl);
    if(!S.habits[id]&&usedSlots()>=n){toast("All slots full",n<5?`Drop a habit, or reach level ${(n-1)*3+1} for slot ${n+1}.`:"Drop a habit to adopt a new one.","star");tone(200,0,.15,"square",.08);return;}
    S.habits[id]=!S.habits[id];save();const on=S.habits[id];const card=b.closest(".tip");card.classList.toggle("adopted",on);
    if(on){const [x,y]=center(b);confetti(x,y,30,7);blip(1.3);toast("Habit adopted",`"${tip.h}" is now a daily quest.`,"star");}
    b.outerHTML=adoptBtn(tip);document.getElementById("slots").outerHTML=slotsHTML();}
  else if(act==="once"){const id=b.dataset.id;const tip=TIPS.find(x=>x.id===id);S.once[id]=!S.once[id];const on=S.once[id];b.closest(".tip").classList.toggle("adopted",on);
    if(on){const [x,y]=center(b);confetti(x,y,40,8);}commit(prev,on?b:null,{prevPct:pp});b.outerHTML=adoptBtn(tip);}
  else if(act==="checkin"){const ci=checkinInfo();S.checkins[ci.idx]=!S.checkins[ci.idx];if(S.checkins[ci.idx]){const [x,y]=center(b);confetti(x,y,50,9);}commit(prev,S.checkins[ci.idx]?b:null,{prevPct:pp});render();}
  else if(act==="medgo"){if(M.running)pauseMed();else startMed();}
  else if(act==="medreset"){resetMed();}});
document.getElementById("view").addEventListener("change",e=>{
  const bwi=e.target.closest('[data-act="bw"]');if(bwi){const di=+bwi.dataset.day;const prev=snapPrev(),pp=calcI(di).pct;const k=dkey(dateOf(di));const v=parseFloat(bwi.value);
    if(!isNaN(v)&&v>30&&v<250)S.bw[k]=Math.round(v*10)/10;else delete S.bw[k];const on=S.bw[k]!=null;
    const q=bwi.closest(".quest");if(q){q.classList.toggle("done",on);const t=trend();q.querySelector(".bwsub").textContent=t.cur?`7-day average ${t.cur.v.toFixed(1)} kg`:"Fasted, after the toilet";}
    commit(prev,on?bwi:null,{prevPct:pp});if(tab==="progress")render();return;}
  const wi=e.target.closest('[data-act="waist"]');if(wi){const k=dkey(now);const v=parseFloat(wi.value);if(!isNaN(v)&&v>40&&v<200)S.waist[k]=Math.round(v*10)/10;else delete S.waist[k];save();render();return;}
  const inp=e.target.closest('[data-act="kg"]');if(!inp)return;const prev=snapPrev(),pp=calcI(sel).pct;
  const card=inp.closest(".ex"),id=card.dataset.ex;const k=dkey(dateOf(sel));const v=parseFloat(inp.value);S.w[id]=(S.w[id]||[]).filter(x=>x.d!==k);
  if(!isNaN(v)&&v>0){S.w[id].push({d:k,kg:v});S.w[id]=S.w[id].sort((a,b)=>a.d<b.d?-1:1).slice(-30);}
  const pr=isPR(id,sel);const exo=sessOf(sel).ex.find(x=>x.id===id);const tmp=document.createElement("div");tmp.innerHTML=exCard(exo,sel,nextSet(sel));card.querySelector(".last").outerHTML=tmp.querySelector(".last").outerHTML;
  if(pr&&ST.prs<countPRs()){const [x,y]=center(inp);confetti(x,y,60,10);toast("New PR",`${exo.n}: ${v} kg`,"up");}
  const s=sessOf(sel);if(s.ex[0].id===id){const old=document.querySelector(".ramp");if(old)old.outerHTML=rampHTML(s.ex[0],sel);}
  commit(prev,pr?inp:null,{prevPct:pp});});

paintMute();render();
</script>
