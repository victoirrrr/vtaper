<style>
/* Training Edge: Daily Edge's visual system (paper, white surfaces, graphite lead cards, one orange signal) applied to a training tracker. Single light look, matching Daily Edge. */
:root{
  --paper:#F3F2EF; --surface:#FFFFFF; --raised:#E9E7E2; --raised-2:#DEDBD5;
  --ink:#15171A; --ink-2:#50555D; --ink-3:#6B7078; --hair:rgba(21,23,26,.08);
  --graphite:#1B1E22; --graphite-2:#24282D; --graphite-3:#2E3338; --on-g:#F3F2EF; --on-g-2:#A9AEB6; --hair-g:rgba(243,242,239,.1);
  --signal:#EE5A2E; --signal-ink:#C2461C; --signal-soft:rgba(238,90,46,.12);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --pad:20px; --ease:cubic-bezier(0.22,1,0.36,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-feature-settings:"cv11","ss01";-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:8px}
.shell{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.view{padding-bottom:calc(104px + var(--safe-b));animation:enter .36s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.meta{font-size:13px;line-height:18px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ico{width:20px;height:20px;flex:none}

/* masthead */
.mast{padding:calc(12px + var(--safe-t)) max(var(--pad),env(safe-area-inset-right,0px)) 0 max(var(--pad),env(safe-area-inset-left,0px))}
.mast-top{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.wordmark{font-weight:600;font-size:18px;line-height:1;letter-spacing:-.01em;margin:0;display:flex;align-items:center;gap:8px}
.wordmark i{width:28px;height:28px;border-radius:8px;background:var(--graphite);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;letter-spacing:-.03em;color:var(--on-g)}
.wordmark i b{color:var(--signal)}
.ring{position:relative;width:44px;height:44px;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:44px;height:44px;transform:rotate(-90deg)}
.ring path{fill:none;stroke-width:3.5;stroke-linecap:round;stroke:var(--raised-2);transition:stroke .4s var(--ease)}
.ring path.on{stroke:var(--signal)}
.ring span{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.dateline{margin-top:20px}
.dateline h1{margin:0;font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.025em}
.dateline .meta{margin-top:2px;font-size:15px;line-height:20px;color:var(--ink-2)}
.week{display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:12px 16px;background:var(--surface);border-radius:14px}
.week ol{display:flex;gap:10px;margin:0;padding:0;list-style:none}
.week li{display:grid;justify-items:center;gap:4px;font-size:11px;line-height:12px;color:var(--ink-3);font-weight:500}
.week li i{width:10px;height:10px;border-radius:50%;background:var(--raised);display:block}
.week li.rest i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--raised-2)}
.week li.done i{background:var(--signal);box-shadow:none}
.week li.today{color:var(--ink)}
.week li.today i{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--ink)}
.week li.today.done i{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--signal)}
.streak{text-align:right}
.streak b{display:block;font-size:20px;line-height:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.streak span{font-size:12px;line-height:16px;color:var(--ink-3)}
.banner{margin:16px 12px 0;padding:12px 16px;border-radius:12px;background:var(--signal-soft);font-size:14px;line-height:20px;color:var(--ink)}
.banner b{color:var(--signal-ink)}

/* lead card */
.lead{margin:20px 12px 0;background:var(--graphite);color:var(--on-g);border-radius:24px;padding:20px;position:relative;overflow:hidden}
.lead .k{display:flex;align-items:center;justify-content:space-between;font-size:13px;line-height:18px;color:var(--on-g-2);font-variant-numeric:tabular-nums}
.lead .k .sec{display:flex;align-items:center;gap:8px;color:var(--on-g)}
.lead .k .sec .ico{color:var(--signal)}
.fig{margin:24px 0 4px;display:grid;gap:4px}
.fig b{font-size:72px;line-height:.95;font-weight:700;letter-spacing:-.045em;color:var(--signal);font-variant-numeric:tabular-nums lining-nums}
.fig b small{font-size:28px;letter-spacing:-.02em;margin-left:4px}
.fig span{font-size:14px;line-height:20px;color:var(--on-g-2);max-width:26em}
.lead h2{font-size:26px;line-height:31px;letter-spacing:-.02em;font-weight:600;margin:20px 0 16px;text-wrap:balance}
.tl{margin:0;border-top:1px solid var(--hair-g)}
.tl div{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--hair-g)}
.tl dt{font-size:13px;line-height:22px;font-weight:600;color:var(--signal)}
.tl dd{margin:0;font-size:15px;line-height:22px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;font-weight:600;font-size:16px;width:100%;transition:transform .15s var(--ease),background-color .15s var(--ease)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--signal);color:var(--ink)}
@media (hover:hover){.btn-primary:hover{background:#F06A41}}
.btn-ghost{background:var(--graphite-2);color:var(--on-g)}
.lead .btn{margin-top:20px}

/* labels and lists */
.label{display:flex;align-items:baseline;justify-content:space-between;padding:28px var(--pad) 10px}
.label h2{margin:0;font-size:20px;line-height:24px;font-weight:700;letter-spacing:-.015em}
.list{margin:0 12px;background:var(--surface);border-radius:20px;overflow:hidden}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;min-height:72px;border-top:1px solid var(--hair);transition:background-color .15s var(--ease)}
.row:first-child{border-top:0}
button.row:active{background:var(--paper)}
@media (hover:hover){button.row:hover{background:#F8F7F5}}
.tile{width:44px;height:44px;border-radius:12px;background:var(--paper);display:grid;place-items:center;color:var(--ink-2);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;transition:background-color .3s var(--ease),color .3s var(--ease)}
.tile.on{background:var(--graphite);color:var(--signal)}
.row .s{display:block;font-size:12px;line-height:16px;color:var(--ink-3);margin-bottom:3px;font-variant-numeric:tabular-nums}
.row .t{display:block;font-size:16px;line-height:21px;font-weight:600;letter-spacing:-.01em}
.row.is-done .t{color:var(--ink-3);font-weight:500}
.row .m{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums;text-align:right}
.row .m.go{color:var(--signal-ink);font-weight:600}
.row.today .tile{box-shadow:inset 0 0 0 2px var(--ink)}
.kgin{width:76px;min-height:40px;padding:8px 10px;border-radius:10px;border:1px solid var(--raised-2);background:var(--paper);font-size:15px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}

/* session view */
.a-head{background:var(--graphite);color:var(--on-g);padding:calc(8px + var(--safe-t)) 8px 28px;border-radius:0 0 24px 24px}
.a-bar{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--on-g)}
.icon-btn:active{background:var(--graphite-2)}
.a-bar .meta{color:var(--on-g-2);padding-right:12px}
.a-head .inner{padding:12px 12px 0}
.a-head .kick{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:600}
.a-head .kick .ico{color:var(--signal)}
.a-head .fig{margin-top:20px}
.a-head h1{font-size:30px;line-height:35px;letter-spacing:-.025em;font-weight:700;margin:16px 0 12px;text-wrap:balance}
.a-head .sub{font-size:13px;line-height:18px;color:var(--on-g-2)}
.short{margin:12px 12px 0;background:var(--surface);border-radius:20px;padding:4px 16px}
.short .tl{border-top:0}
.short .tl div{border-bottom:1px solid var(--hair)}
.short .tl div:last-child{border-bottom:0}
.short .tl dt{color:var(--signal-ink)}
.ex{margin:0 12px 10px;background:var(--surface);border-radius:20px;padding:16px;display:grid;gap:12px}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ex-top>div{min-width:0}
.ex .s{font-size:12px;line-height:16px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ex h3{margin:2px 0 0;font-size:17px;line-height:22px;font-weight:600;letter-spacing:-.01em}
.ex .rx{font-size:22px;line-height:24px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex .cue{margin:0;font-size:14px;line-height:20px;color:var(--ink-2)}
.ex-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sets{display:flex;gap:8px}
.set{width:40px;height:40px;border-radius:12px;background:var(--paper);font-size:14px;font-weight:600;color:var(--ink-2);display:grid;place-items:center;transition:background-color .2s var(--ease),color .2s var(--ease),transform .15s var(--ease)}
.set:active{transform:scale(.92)}
.set.on{background:var(--graphite);color:var(--signal)}
.kg{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-3)}
.ex.complete{box-shadow:inset 0 0 0 1.5px var(--signal)}
.last{font-size:13px;line-height:18px;color:var(--ink-3)}
.last b{color:var(--ink-2);font-weight:600}
.a-foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--hair);padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + var(--safe-b)) max(12px,env(safe-area-inset-left,0px))}
.a-foot .inner{max-width:576px;margin:0 auto}
.a-foot .btn{justify-content:space-between;padding:0 20px}
.a-foot .btn span:last-child{font-weight:500;font-size:14px}

/* progress */
.page-h{padding:calc(12px + var(--safe-t)) var(--pad) 0}
.page-h .meta{display:block;padding-top:16px}
.page-h h1{font-size:34px;line-height:40px;letter-spacing:-.025em;font-weight:700;margin:2px 0 0}
.chart{display:block;width:100%;height:auto;margin-top:16px}
.chart text{font-size:10px;fill:var(--on-g-2);font-variant-numeric:tabular-nums}
.logw{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--on-g-2)}
.logw .kgin{background:var(--graphite-2);border-color:var(--graphite-3);color:var(--on-g)}
.rules{margin:12px 12px 0;background:var(--surface);border-radius:20px;padding:4px 16px}
.rules .tl{border-top:0}
.rules .tl div{border-bottom:1px solid var(--hair);grid-template-columns:92px 1fr}
.rules .tl div:last-child{border-bottom:0}
.rules .tl dt{color:var(--signal-ink)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--hair);padding-bottom:var(--safe-b);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tabs button{min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;line-height:13px;font-weight:600;color:var(--ink-3)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] .ico{color:var(--signal)}
@media (prefers-reduced-motion:reduce){.view{animation:none!important}*{transition:none!important}}
</style>
</head>

/* ================= STATE ================= */
var KEY='training-edge.v1';
var S=(function(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r)return r;}catch(e){}var bw={'2026-11-05':74};try{var o=JSON.parse(localStorage.getItem('liftrunbreathe.v1'));if(o&&o.bw)Object.keys(o.bw).forEach(function(k){var v=+o.bw[k];if(v>30&&v<250)bw[k]=v;});}catch(e){}return {log:{},bw:bw};})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function pad(n){return (n<10?'0':'')+n;}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dobj(k){return new Date(k+'T00:00:00');}
function addDays(k,n){var d=dobj(k);d.setDate(d.getDate()+n);return iso(d);}
var TODAY=iso(new Date());
function dow(k){return (dobj(k).getDay()+6)%7;}
function weekOf(k){var w=Math.floor((dobj(k)-dobj(START))/(7*864e5))+1;return Math.max(1,Math.min(WEEKS,w));}
function weekRaw(k){return Math.floor((dobj(k)-dobj(START))/(7*864e5))+1;}
function L(k,create){if(!S.log[k]){if(create===false)return null;S.log[k]={done:false,sets:{},kg:{},warm:{},cool:{},seg:{},basics:{}};}return S.log[k];}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function svg(d){return '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';}
var IC={
  lift:'<path d="M3 12h18M6.5 8v8M17.5 8v8M4 10v4M20 10v4"/>',
  run:'<path d="M4 18h5l3-5 4 2 4-7"/><circle cx="18" cy="5" r="1.6"/>',
  rest:'<path d="M18.5 15.5A7.5 7.5 0 0 1 8.5 5.5a7.5 7.5 0 1 0 10 10Z"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',back:'<path d="M15 5l-7 7 7 7"/>',scale:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 10a3.5 3.5 0 0 1 7 0M12 10l1.6-1.6"/>',
  next:'<path d="M9 5l7 7-7 7"/>'};

function session(k){var t=DAYPLAN[dow(k)],w=weekOf(k);
  if(t==='rest')return {type:'rest',name:'Rest',kind:'Gym closed',title:'Walk, move, recover',min:30};
  if(t==='run-int'){var p=INT[w-1];return {type:'run',key:t,name:'Treadmill intervals',kind:p.t,title:p.t,segs:p.segs,min:p.min};}
  if(t==='run-easy'){var q=EASY[w-1];return {type:'run',key:t,name:'Easy treadmill',kind:q.t,title:q.t,segs:q.segs,min:q.min,test:q.test};}
  var l=LIFT[t];return {type:'lift',key:t,name:l.name,kind:l.kind,title:l.title,focus:l.focus,ex:l.ex,min:60};}
function deload(k){return weekRaw(k)===DELOAD;}
function setsFor(e,k){return deload(k)?Math.min(2,e.sets):e.sets;}
function totalSets(s,k){return s.ex.reduce(function(a,e){return a+setsFor(e,k);},0);}
function doneSets(s,k){var l=L(k,false);if(!l)return 0;return s.ex.reduce(function(a,e){return a+(l.sets[e.id]||[]).slice(0,setsFor(e,k)).filter(Boolean).length;},0);}
function dayDone(k){var l=L(k,false);if(!l)return false;if(session(k).type==='rest')return !!l.done||!!l.basics.routine;return !!l.done;}
function lastKg(id,k){var ks=Object.keys(S.log).filter(function(d){return d<k&&S.log[d].kg&&S.log[d].kg[id];}).sort();return ks.length?S.log[ks[ks.length-1]].kg[id]:null;}
function bestKg(id){var b=null;Object.keys(S.log).forEach(function(d){var v=S.log[d].kg&&S.log[d].kg[id];if(v&&(!b||v>b))b=v;});return b;}

/* ================= TODAY ================= */
function ringHTML(k){var s=session(k),l=L(k,false)||{basics:{}};
  var items=[dayDone(k),!!l.basics.routine,S.bw[k]!=null,!!l.basics.protein,!!l.basics.kitchen];
  var n=items.length,r=18,c=22,gap=.22,out='';items.forEach(function(on,i){var a0=i/n*2*Math.PI+gap/2,a1=(i+1)/n*2*Math.PI-gap/2;
    out+='<path class="'+(on?'on':'')+'" d="M'+(c+r*Math.cos(a0)).toFixed(2)+' '+(c+r*Math.sin(a0)).toFixed(2)+' A'+r+' '+r+' 0 0 1 '+(c+r*Math.cos(a1)).toFixed(2)+' '+(c+r*Math.sin(a1)).toFixed(2)+'"/>';});
  var d=items.filter(Boolean).length;return '<div class="ring" role="img" aria-label="'+d+' of '+n+' done today"><svg viewBox="0 0 44 44">'+out+'</svg><span>'+d+'</span></div>';}
function weekStrip(){var mon=addDays(TODAY,-dow(TODAY)),Ls=['M','T','W','T','F','S','S'],items='';
  for(var i=0;i<7;i++){var k=addDays(mon,i);var cls=(dayDone(k)?'done':'')+(DAYPLAN[i]==='rest'?' rest':'')+(k===TODAY?' today':'');items+='<li class="'+cls+'"><i></i>'+Ls[i]+'</li>';}
  var st=0,d=TODAY;if(!dayDone(d))d=addDays(d,-1);while(dayDone(d)&&st<400){st++;d=addDays(d,-1);}
  return '<div class="week"><ol aria-label="Sessions this week">'+items+'</ol><div class="streak">'+(st?'<b>'+st+'</b><span>day streak</span>':'<b>Day 1</b><span>finish today to start</span>')+'</div></div>';}
function leadHTML(k){var s=session(k),l=L(k,false)||{basics:{}};var done=dayDone(k);
  var icon=s.type==='lift'?IC.lift:s.type==='run'?IC.run:IC.rest;
  var h='<article class="lead"><div class="k"><span class="sec">'+svg(icon)+esc(s.name)+(s.type!=='rest'?' · '+esc(s.kind):'')+'</span><span>'+s.min+' min</span></div>';
  if(s.type==='lift'){var tot=totalSets(s,k),ds=doneSets(s,k);
    h+='<div class="fig"><b>'+(ds?ds+'<small>/'+tot+'</small>':tot)+'</b><span>'+(ds?'working sets done':'working sets across '+s.ex.length+' exercises')+'</span></div><h2>'+esc(s.title)+'</h2><dl class="tl">'+
      '<div><dt>Focus</dt><dd>'+esc(s.focus)+'</dd></div><div><dt>Effort</dt><dd>Stop 1 to 2 reps short of failure on every set.</dd></div>'+
      '<div><dt>Progress</dt><dd>Top of the rep range on every set? Add 1.25 to 2.5 kg a side next time.</dd></div></dl>';
    h+='<button type="button" class="btn '+(done?'btn-ghost':'btn-primary')+'" data-go="day-'+k+'">'+(done?'Session done · view it':ds?'Continue session':'Start session')+'</button>';}
  else if(s.type==='run'){h+='<div class="fig"><b>'+s.min+'<small>min</small></b><span>on the treadmill · '+esc(s.kind)+'</span></div><h2>'+esc(s.name==='Easy treadmill'?'Easy pace. Full sentences the whole way.':'Short and hard, then fully recover.')+'</h2><dl class="tl">'+
      s.segs.map(function(g,i){return '<div><dt>'+(i===0?'Warm':i===s.segs.length-1?'Finish':'Main')+'</dt><dd>'+esc(g[0])+(g[1]&&g[1]!=='test'&&g[1]!=='rest of the time'?' · '+esc(g[1]):'')+'</dd></div>';}).join('')+
      '<div><dt>Back stiff?</dt><dd>Swap for an incline walk: 10%, 5.5 km/h, same time.</dd></div></dl>';
    h+='<button type="button" class="btn '+(done?'btn-ghost':'btn-primary')+'" data-go="day-'+k+'">'+(done?'Done · view it':'Open session')+'</button>';}
  else{h+='<div class="fig"><b>30<small>min</small></b><span>easy walk, outside if you can</span></div><h2>Gym closed. Move gently and recover.</h2><dl class="tl">'+
      '<div><dt>Walk</dt><dd>30 minutes at an easy pace. Counts toward your steps.</dd></div><div><dt>Back</dt><dd>Do the wake-up routine, then the McGill big 3 once in the day.</dd></div>'+
      '<div><dt>Food</dt><dd>Same targets as training days. Rest days aren\'t cheat days.</dd></div></dl>';
    h+='<button type="button" class="btn '+(l.done?'btn-ghost':'btn-primary')+'" data-act="restdone" data-k="'+k+'">'+(l.done?'Walk done':'Mark walk done')+'</button>';}
  return h+'</article>';}
function basicsHTML(k){var l=L(k,false)||{basics:{}};var w=S.bw[k];
  var rows=BASICS.map(function(b){var on=!!l.basics[b.id];return '<button type="button" class="row'+(on?' is-done':'')+'" data-basic="'+b.id+'" aria-pressed="'+on+'"><span class="tile'+(on?' on':'')+'" aria-hidden="true">'+svg(on?IC.check:b.ic)+'</span><span><span class="s">'+esc(b.s)+'</span><span class="t">'+esc(b.n)+'</span></span><span class="m">'+(on?'Done':'')+'</span></button>';});
  rows.splice(1,0,'<div class="row'+(w!=null?' is-done':'')+'"><span class="tile'+(w!=null?' on':'')+'" aria-hidden="true">'+svg(w!=null?IC.check:IC.scale)+'</span><span><span class="s">Fasted, after the toilet</span><span class="t">Morning weigh-in</span></span><label class="kg"><input class="kgin" id="bw-'+k+'" type="number" inputmode="decimal" step="0.1" min="30" max="250" placeholder="kg" value="'+(w!=null?w:'')+'" data-bw="'+k+'" aria-label="Morning weight in kg"></label></div>');
  return '<div class="label"><h2>Daily basics</h2><span class="meta">every day</span></div><div class="list">'+rows.join('')+'</div>';}

  for(var i=0;i<7;i++){var k=addDays(mon,i),s=session(k),dn=dayDone(k),isT=k===TODAY;var d=dobj(k);
    h+='<button type="button" class="row'+(dn?' is-done':'')+(isT?' today':'')+'" data-go="day-'+k+'"><span class="tile'+(dn?' on':'')+'" aria-hidden="true">'+(dn?svg(IC.check):d.getDate())+'</span><span><span class="s">'+d.toLocaleDateString('en-GB',{weekday:'long'})+(s.type!=='rest'?' · '+s.min+' min':'')+'</span><span class="t">'+esc(s.name)+(s.type==='lift'?' · '+esc(s.kind):s.type==='run'?' · '+esc(s.kind):'')+'</span></span><span class="m'+(isT&&!dn?' go':'')+'">'+(dn?'Done':isT?'Today':(k<TODAY&&s.type!=='rest')?'Missed':'')+'</span></button>';}

function renderToday(){var d=dobj(TODAY),s=session(TODAY);
  var h='<div class="view"><header class="mast"><div class="mast-top"><p class="wordmark"><i aria-hidden="true">T<b>E</b></i>Training Edge</p>'+ringHTML(TODAY)+'</div>'+
    '<div class="dateline"><h1>'+d.toLocaleDateString('en-GB',{weekday:'long'})+'</h1><div class="meta">'+d.toLocaleDateString('en-GB',{day:'numeric',month:'long'})+' · Week '+weekOf(TODAY)+' · '+esc(s.name)+'</div></div>'+weekStrip()+'</header>';

/* ================= SESSION ================= */
function checklist(arr,group,k){var l=L(k,false)||{};var st=l[group]||{};
  return '<div class="list">'+arr.map(function(a,i){var on=!!st[i];return '<button type="button" class="row'+(on?' is-done':'')+'" data-check="'+group+'" data-i="'+i+'" data-k="'+k+'" aria-pressed="'+on+'"><span class="tile'+(on?' on':'')+'" aria-hidden="true">'+(on?svg(IC.check):pad(i+1))+'</span><span><span class="s">'+esc(a[1])+'</span><span class="t">'+esc(a[0])+'</span></span><span class="m"></span></button>';}).join('')+'</div>';}
function exCard(e,k,i){var l=L(k,false)||{sets:{},kg:{}};var n=setsFor(e,k),arr=l.sets[e.id]||[];var dn=arr.slice(0,n).filter(Boolean).length;var lk=lastKg(e.id,k),bk=bestKg(e.id);
  var b='';for(var j=0;j<n;j++)b+='<button type="button" class="set'+(arr[j]?' on':'')+'" data-set="'+e.id+'" data-j="'+j+'" data-k="'+k+'" aria-pressed="'+!!arr[j]+'" aria-label="Set '+(j+1)+'">'+(arr[j]?svg(IC.check):(j+1))+'</button>';
  return '<article class="ex'+(dn===n?' complete':'')+'"><div class="ex-top"><div><span class="s">'+pad(i+1)+'</span><h3>'+esc(e.n)+'</h3></div><span class="rx">'+n+' × '+esc(e.reps)+'</span></div><p class="cue">'+esc(e.cue)+'</p>'+
    '<div class="ex-foot"><div class="sets" role="group" aria-label="Sets for '+esc(e.n)+'">'+b+'</div><label class="kg"><input class="kgin" id="kg-'+k+'-'+e.id+'" type="number" inputmode="decimal" step="0.25" min="0" placeholder="'+(lk!=null?lk:'kg')+'" value="'+(l.kg[e.id]!=null?l.kg[e.id]:'')+'" data-kg="'+e.id+'" data-k="'+k+'" aria-label="Weight in kg for '+esc(e.n)+'">kg</label></div>'+
    '<div class="last">'+(lk!=null?'Last time <b>'+lk+' kg</b>':(e.start?'Start at <b>'+esc(e.start)+'</b>':'Pick a weight you could lift 2 more reps with'))+(bk!=null&&bk!==lk?' · best '+bk+' kg':'')+'</div></article>';}
function renderDay(k){var s=session(k),l=L(k,false)||{},d=dobj(k);var icon=s.type==='lift'?IC.lift:s.type==='run'?IC.run:IC.rest;
  var h='<div class="view"><header class="a-head"><div class="a-bar"><button type="button" class="icon-btn" data-tab="today" aria-label="Back to today">'+svg(IC.back)+'</button><span class="meta">'+d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'})+'</span></div>'+
    '<div class="inner"><div class="kick">'+svg(icon)+esc(s.name)+(s.type!=='rest'?' · '+esc(s.kind):'')+'</div>';
  if(s.type==='lift')h+='<div class="fig"><b>'+totalSets(s,k)+'</b><span>working sets · about 60 min'+(deload(k)?' · lighter week':'')+'</span></div>';
  else h+='<div class="fig"><b>'+s.min+'<small>min</small></b><span>'+(s.type==='run'?'treadmill':'easy walk')+'</span></div>';

  if(s.type==='lift'){h+='<section class="short" aria-label="Rules"><dl class="tl"><div><dt>Effort</dt><dd>Stop 1 to 2 reps short of failure.</dd></div><div><dt>Rest</dt><dd>2 to 3 min on the first two lifts, about 1 min after that.</dd></div><div><dt>Back</dt><dd>Sharp pain or pain down the leg: stop that exercise and swap it.</dd></div></dl></section>';

/* ================= PROGRESS ================= */
function bwList(){return Object.keys(S.bw).sort().map(function(d){return {d:d,kg:+S.bw[d]};});}
function avgAt(k,list){var lo=addDays(k,-6);var w=list.filter(function(x){return x.d>=lo&&x.d<=k;});return w.length?w.reduce(function(a,x){return a+x.kg;},0)/w.length:null;}
function chartSVG(list){var W=320,H=150,pl=26,pr=6,pt=8,pb=20;var s0=dobj('2026-11-05');var end=new Date(s0);end.setDate(end.getDate()+112);
  if(list.length){var ld=dobj(list[list.length-1].d);if(ld>end){end=new Date(ld);end.setDate(end.getDate()+14);}}
  var span=end-s0,ks=list.map(function(x){return x.kg;});var y1=Math.max(75,Math.ceil(Math.max.apply(null,ks.concat([74]))+.3)),y0=Math.min(69,Math.floor(Math.min.apply(null,ks.concat([70]))-.3));
  function X(d){return (pl+(d-s0)/span*(W-pl-pr)).toFixed(1);}function Y(v){return (pt+(y1-v)/(y1-y0)*(H-pt-pb)).toFixed(1);}
  var g='';for(var v=y0;v<=y1;v++)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="rgba(243,242,239,.08)"/><text x="'+(pl-5)+'" y="'+(+Y(v)+3.5)+'" text-anchor="end">'+v+'</text>';
  var m=new Date(s0.getFullYear(),s0.getMonth()+1,1);while(m<=end){g+='<text x="'+X(m)+'" y="'+(H-4)+'" text-anchor="middle">'+m.toLocaleDateString('en-GB',{month:'short'})+'</text>';m.setMonth(m.getMonth()+1);}
  g+='<rect x="'+pl+'" y="'+Y(71)+'" width="'+(W-pl-pr)+'" height="'+(Y(70)-Y(71))+'" fill="rgba(238,90,46,.14)"/><text x="'+(W-pr)+'" y="'+(+Y(71)-4)+'" text-anchor="end" style="fill:#EE5A2E;font-weight:600">goal 70-71</text>';
  var up=[],lo=[];for(var w=0;w<=16;w++){var d=new Date(s0);d.setDate(d.getDate()+w*7);if(d>end)break;up.push(X(d)+','+Y(Math.max(70,74-.25*w)));lo.push(X(d)+','+Y(Math.max(70,74-.4*w)));}
  g+='<polygon points="'+up.join(' ')+' '+lo.reverse().join(' ')+'" fill="rgba(243,242,239,.08)"/>';
  g+=list.map(function(x){return '<circle cx="'+X(dobj(x.d))+'" cy="'+Y(x.kg)+'" r="2.4" fill="#6B7078"/>';}).join('');
  if(list.length>1)g+='<polyline points="'+list.map(function(x){return X(dobj(x.d))+','+Y(avgAt(x.d,list));}).join(' ')+'" fill="none" stroke="#EE5A2E" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  if(list.length){var lx=list[list.length-1];g+='<circle cx="'+X(dobj(lx.d))+'" cy="'+Y(avgAt(lx.d,list))+'" r="4.5" fill="#EE5A2E" stroke="#1B1E22" stroke-width="2"/>';}
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weight trend toward 70 to 71 kg">'+g+'</svg>';}
function renderProgress(){var list=bwList(),last=list[list.length-1],cur=last?avgAt(last.d,list):74;
  var prevA=last?avgAt(addDays(last.d,-7),list):null;var nNow=last?list.filter(function(x){return x.d>addDays(last.d,-7)&&x.d<=last.d;}).length:0;var nPrev=last?list.filter(function(x){return x.d>addDays(last.d,-14)&&x.d<=addDays(last.d,-7);}).length:0;
  var rate=(prevA!=null&&nNow>=3&&nPrev>=3)?prevA-cur:null;var pace=rate!=null&&rate>.1?rate:.3;var eta=new Date();eta.setDate(eta.getDate()+Math.round(Math.max(0,cur-71)/pace*7));
  var status=rate==null?'Weigh in daily. The pace check starts after two weeks.':rate>.5?'Faster than 0.5 kg a week. Add about 150 kcal to protect your lifts.':rate>=.25?'On pace. Change nothing.':rate>=.12?'A little slow. Hold steady one more week.':'Flat. If it stays flat a second week, trim 100 to 150 kcal.';
  var h='<div class="view"><header class="page-h"><span class="meta">74 kg start · goal 70 to 71 kg</span><h1>Progress</h1></header>';
  h+='<article class="lead"><div class="k"><span class="sec">'+svg(IC.scale)+'Weight, 7-day average</span><span>'+list.length+' weigh-in'+(list.length===1?'':'s')+'</span></div><div class="fig"><b>'+cur.toFixed(1)+'<small>kg</small></b><span>'+esc(status)+'</span></div>'+chartSVG(list)+
    '<dl class="tl" style="margin-top:12px"><div><dt>Lost</dt><dd>'+Math.max(0,74-cur).toFixed(1)+' kg since 5 Nov</dd></div><div><dt>Pace</dt><dd>'+(rate!=null?rate.toFixed(2)+' kg a week · target 0.25 to 0.4':'Needs two weeks of weigh-ins')+'</dd></div><div><dt>71 kg by</dt><dd>'+(cur<=71?'Reached':'about '+eta.toLocaleDateString('en-GB',{day:'numeric',month:'short'}))+'</dd></div></dl>'+
    '<label class="logw" for="bw-p">Today\'s weight <input class="kgin" id="bw-p" type="number" inputmode="decimal" step="0.1" min="30" max="250" placeholder="kg" value="'+(S.bw[TODAY]!=null?S.bw[TODAY]:'')+'" data-bw="'+TODAY+'"> kg</label></article>';
  var mains=[['smsq','Smith squat'],['smb','Smith bench'],['smht','Smith hip thrust'],['lpd','Lat pulldown'],['crow','Seated cable row'],['dbrdl','Dumbbell RDL']];
  h+='<div class="label"><h2>Main lifts</h2><span class="meta">best logged</span></div><div class="list">'+mains.map(function(m){var b=bestKg(m[0]),l=lastKg(m[0],addDays(TODAY,1));return '<div class="row"><span class="tile" aria-hidden="true">'+svg(IC.lift)+'</span><span><span class="s">'+(l!=null?'Last '+l+' kg':'Not logged yet')+'</span><span class="t">'+m[1]+'</span></span><span class="m" style="font-size:16px;font-weight:700;color:var(--ink)">'+(b!=null?b+' kg':'')+'</span></div>';}).join('')+'</div>';
  var all=Object.keys(S.log).filter(function(k){return S.log[k].done&&session(k).type!=='rest';}).length;var mon=addDays(TODAY,-dow(TODAY));var wk=0;for(var i=0;i<7;i++){var k=addDays(mon,i);if(session(k).type!=='rest'&&dayDone(k))wk++;}
  h+='<div class="label"><h2>Sessions</h2></div><div class="list"><div class="row"><span class="tile" aria-hidden="true">'+wk+'</span><span><span class="s">This week</span><span class="t">'+wk+' of 6 sessions</span></span><span class="m"></span></div><div class="row"><span class="tile" aria-hidden="true">'+all+'</span><span><span class="s">Since 9 November</span><span class="t">'+all+' session'+(all===1?'':'s')+' finished</span></span><span class="m"></span></div></div>';
  h+='</div>';mount(h,'progress');}

/* ================= PLAN ================= */
function renderPlan(){var names=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var h='<div class="view"><header class="page-h"><span class="meta">4 strength · 2 treadmill · 1 rest</span><h1>Plan</h1></header><div class="label"><h2>Every week</h2><span class="meta">9 am, about 60 min</span></div><div class="list">';
  for(var i=0;i<7;i++){var k=addDays(addDays(TODAY,-dow(TODAY)),i),s=session(k);h+='<button type="button" class="row" data-go="day-'+k+'"><span class="tile" aria-hidden="true">'+svg(s.type==='lift'?IC.lift:s.type==='run'?IC.run:IC.rest)+'</span><span><span class="s">'+names[i]+'</span><span class="t">'+esc(s.name)+(s.type==='lift'?' · '+esc(s.kind):'')+'</span></span><span class="m">'+svg(IC.next)+'</span></button>';}
  h+='</div><div class="label"><h2>The rules</h2></div><section class="rules"><dl class="tl">'+
    '<div><dt>Progress</dt><dd>When every set hits the top of its rep range, add 1.25 to 2.5 kg a side.</dd></div>'+
    '<div><dt>Effort</dt><dd>Stop 1 to 2 reps short of failure. Form before load.</dd></div>'+
    '<div><dt>Lighter week</dt><dd>Week 5: two sets per exercise at the same weights.</dd></div>'+
    '<div><dt>Back</dt><dd>3-minute routine on waking. McGill big 3 in every warm-up. Nothing heavy in the first hour after waking. No barbell on the spine.</dd></div>'+
    '<div><dt>Treadmill</dt><dd>Monday hard, Friday easy. Stiff back: incline walk at 10%, 5.5 km/h.</dd></div></dl></section>'+
    '<div class="label"><h2>Food</h2><span class="meta">about 2,200 kcal</span></div><section class="rules"><dl class="tl">'+
    '<div><dt>Protein</dt><dd>130 g a day: eggs at breakfast, chicken or paneer at lunch, whey after training, dal or curd at dinner.</dd></div>'+
    '<div><dt>Timing</dt><dd>Lunch is the biggest meal. Dinner small, protein-led, finished by 8:30 pm.</dd></div>'+
    '<div><dt>Fat</dt><dd>Spread across 4 meals. No heavy fried or ghee-rich dinners.</dd></div>'+
    '<div><dt>Steer</dt><dd>Lose 0.25 to 0.4 kg a week. Faster: eat 150 kcal more. Flat for 2 weeks: 100 to 150 kcal less.</dd></div></dl></section>'+
    '<div class="label"><h2>Check-ins</h2></div><section class="rules"><dl class="tl"><div><dt>Every 2 weeks</dt><dd>Front, side and back photos, fasted, same bathroom and light. Waist at the navel.</dd></div><div><dt>See a physio</dt><dd>If back pain turns sharp or runs down the leg.</dd></div></dl></section></div>';
  mount(h,'plan');}

/* ================= ROUTER ================= */
var app=document.getElementById('app'),tabs=document.getElementById('tabs');
function mount(h,tab){app.innerHTML=h;tabs.hidden=!tab;Array.prototype.forEach.call(tabs.querySelectorAll('button'),function(b){if(b.getAttribute('data-tab')===tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});}
function route(keepScroll){var h=(location.hash||'').slice(1)||'today';if(!keepScroll)window.scrollTo(0,0);
  var m=/^day-(\d{4}-\d{2}-\d{2})$/.exec(h);if(m)return renderDay(m[1]);if(h==='progress')return renderProgress();if(h==='plan')return renderPlan();renderToday();}
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h;}
function rerender(){var y=window.scrollY;route(true);window.scrollTo(0,y);}
document.addEventListener('click',function(ev){var t=ev.target.closest('button');if(!t)return;
  if(t.hasAttribute('data-tab'))return go(t.getAttribute('data-tab'));
  if(t.hasAttribute('data-go'))return go(t.getAttribute('data-go'));
  if(t.hasAttribute('data-basic')){var l=L(TODAY);l.basics[t.getAttribute('data-basic')]=!l.basics[t.getAttribute('data-basic')];save();return rerender();}
  if(t.hasAttribute('data-check')){var k=t.getAttribute('data-k'),g=t.getAttribute('data-check'),i=t.getAttribute('data-i'),l2=L(k);l2[g]=l2[g]||{};l2[g][i]=!l2[g][i];save();return rerender();}
  if(t.hasAttribute('data-set')){var k2=t.getAttribute('data-k'),id=t.getAttribute('data-set'),j=+t.getAttribute('data-j'),l3=L(k2);l3.sets[id]=l3.sets[id]||[];l3.sets[id][j]=!l3.sets[id][j];save();try{if(l3.sets[id][j]&&navigator.vibrate)navigator.vibrate(12);}catch(e){}return rerender();}
  var act=t.getAttribute('data-act');
  if(act==='finish'){var l4=L(t.getAttribute('data-k'));l4.done=!l4.done;save();if(l4.done)return go('today');return rerender();}
  if(act==='restdone'){var l5=L(t.getAttribute('data-k'));l5.done=!l5.done;save();return rerender();}});
document.addEventListener('change',function(ev){var t=ev.target;
  if(t.hasAttribute('data-bw')){var k=t.getAttribute('data-bw'),v=parseFloat(t.value);if(!isNaN(v)&&v>30&&v<250)S.bw[k]=Math.round(v*10)/10;else delete S.bw[k];save();return rerender();}
  if(t.hasAttribute('data-kg')){var k2=t.getAttribute('data-k'),id=t.getAttribute('data-kg'),v2=parseFloat(t.value),l=L(k2);if(!isNaN(v2)&&v2>=0)l.kg[id]=v2;else delete l.kg[id];save();return;}
  if(t.hasAttribute('data-test')){var l2=L(t.getAttribute('data-test')),v3=parseFloat(t.value);if(!isNaN(v3))l2.test=v3;else delete l2.test;save();}});
window.addEventListener('hashchange',function(){route();});
route();
})();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){try{navigator.serviceWorker.register('sw.js').catch(function(){});}catch(e){}}
</script>
